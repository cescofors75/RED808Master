<!DOCTYPE html>
<html lang="es">
<head>

<style>

*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",Courier,monospace;overflow:hidden}body:before{content:"";position:fixed;inset:0;z-index:99;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px),radial-gradient(circle at 25% 15%,rgba(255,79,67,.12),transparent 32%),radial-gradient(circle at 70% 55%,rgba(52,152,219,.1),transparent 35%)}
button{font:inherit;color:inherit}#app{height:100dvh;display:grid;grid-template-rows:48px 1fr 178px;background:linear-gradient(135deg,#070608 0%,#120a11 48%,#06080b 100%)}
header{z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;background:rgba(15,12,16,.92);border-bottom:1px solid var(--wire);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:14px;min-width:0}.brand-name{font-family:Impact,"Arial Black",sans-serif;font-size:24px;letter-spacing:6px;color:var(--red2);text-shadow:0 0 22px rgba(255,79,67,.55)}.brand-sep{width:1px;height:22px;background:var(--wire2)}.brand-sub{font-size:8px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);white-space:nowrap}.hdr-center{display:flex;align-items:center;gap:14px}.mode-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--wire2);padding:5px 11px;font-size:8px;letter-spacing:3px;text-transform:uppercase;background:rgba(255,255,255,.025)}.mode-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 1s infinite}.mode-pill.ws-off .dot{background:var(--red2);box-shadow:0 0 12px var(--red2)}@keyframes pulse{50%{opacity:.35}}.bpm-block{display:flex;align-items:baseline;gap:5px}.bpm-val{font-family:Impact,"Arial Black",sans-serif;font-size:28px;color:var(--amber);letter-spacing:2px;line-height:1}.bpm-lbl{font-size:7px;letter-spacing:3px;color:var(--muted)}.hdr-right{display:flex;align-items:center;gap:12px}.led-row{display:flex;gap:8px}.led-chip{display:flex;align-items:center;gap:4px;font-size:7px;letter-spacing:1px;color:var(--muted);white-space:nowrap}.led{width:6px;height:6px;border-radius:50%;background:#221720;transition:.12s}.led.r{background:var(--red2);box-shadow:0 0 10px var(--red2)}.led.g{background:var(--green);box-shadow:0 0 10px var(--green)}.led.b{background:var(--blue);box-shadow:0 0 10px var(--blue)}.led.a{background:var(--amber);box-shadow:0 0 10px var(--amber)}#camBtn{font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:7px 14px;background:transparent;border:1px solid var(--red2);color:var(--red2);cursor:pointer;transition:.18s}#camBtn:hover,#camBtn.active{background:rgba(255,79,67,.12);border-color:var(--green);color:var(--green)}
#main{min-height:0;display:grid;grid-template-columns:1fr 232px;overflow:hidden}#cam-view{position:relative;overflow:hidden;background:#030204}#cam-view:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,79,67,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,79,67,.045) 1px,transparent 1px);background-size:52px 52px}#cam-view:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(255,79,67,.08) 1px,transparent 1px) center/100% 50%,linear-gradient(90deg,rgba(66,255,227,.055) 1px,transparent 1px) center/50% 100%;background-repeat:no-repeat}.cc{position:absolute;width:28px;height:28px;z-index:5;pointer-events:none}.cc.tl{top:12px;left:12px;border-top:1px solid var(--red2);border-left:1px solid var(--red2)}.cc.tr{top:12px;right:12px;border-top:1px solid var(--red2);border-right:1px solid var(--red2)}.cc.bl{bottom:12px;left:12px;border-bottom:1px solid var(--red2);border-left:1px solid var(--red2)}.cc.br{bottom:12px;right:12px;border-bottom:1px solid var(--red2);border-right:1px solid var(--red2)}#videoEl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .45s;z-index:1}#videoEl.visible{opacity:.35}#mainCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}.zone-lbl{position:absolute;z-index:6;font-size:7px;letter-spacing:3px;text-transform:uppercase;pointer-events:none}.zone-lbl.left{top:50%;left:16px;transform:translateY(-50%) rotate(-90deg);color:rgba(52,152,219,.45)}.zone-lbl.right{top:50%;right:16px;transform:translateY(-50%) rotate(90deg);color:rgba(255,79,67,.5)}.zone-lbl.head{top:16px;left:50%;transform:translateX(-50%);color:rgba(155,89,182,.45)}#gFlash{position:absolute;z-index:10;pointer-events:none;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Impact,"Arial Black",sans-serif;font-size:0;letter-spacing:7px;color:var(--red3);text-shadow:0 0 44px rgba(255,79,67,.7);opacity:0;transition:opacity .08s,font-size .08s;white-space:nowrap}#gFlash.show{opacity:1;font-size:52px}.fx-bar{position:absolute;z-index:7;width:3px;top:10%;bottom:10%;background:var(--wire2)}#fxReverb{left:8px}#fxDelay{right:8px}#fxReverbFill,#fxDelayFill{position:absolute;bottom:0;width:100%;height:0;background:linear-gradient(to top,var(--blue),transparent);transition:height .08s}#fxDelayFill{background:linear-gradient(to top,var(--purple),transparent)}.fx-lbl{position:absolute;z-index:8;font-size:7px;letter-spacing:2px;color:rgba(255,255,255,.22)}#lblReverb{left:14px;top:9%}#lblDelay{right:14px;top:9%}
#right-panel{border-left:1px solid var(--wire);background:rgba(15,12,16,.94);display:flex;flex-direction:column;overflow:hidden}.rpanel-block{border-bottom:1px solid var(--wire);padding:9px 12px}.block-title{font-size:6px;letter-spacing:4px;text-transform:uppercase;color:rgba(205,189,204,.27);margin-bottom:8px}.ch-strips{display:flex;flex-direction:column;gap:4px}.ch-strip{display:grid;grid-template-columns:36px 1fr 24px 18px;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;cursor:pointer;transition:.12s}.ch-strip:hover,.ch-strip.lit{background:rgba(255,79,67,.065);border-color:rgba(255,79,67,.35)}.ch-strip.muted{opacity:.34}.ch-strip.solo{border-color:rgba(243,156,18,.5);background:rgba(243,156,18,.06)}.ch-name{font-family:Impact,"Arial Black",sans-serif;font-size:11px;color:var(--bright);letter-spacing:1px}.ch-vu{height:3px;background:rgba(255,255,255,.06);overflow:hidden}.ch-vu-fill{height:100%;width:0;background:linear-gradient(to right,var(--green),var(--amber),var(--red2));transition:width .05s}.ch-mut{height:15px;border:1px solid var(--wire2);display:flex;align-items:center;justify-content:center;font-size:6px;color:var(--muted)}.ch-strip.muted .ch-mut{color:var(--red2);border-color:var(--red2);background:rgba(255,79,67,.15)}.ch-strip.solo .ch-mut{color:var(--amber);border-color:var(--amber);background:rgba(243,156,18,.13)}.ch-dot{width:6px;height:6px;border-radius:50%;background:#221720}.ch-strip.lit .ch-dot{background:var(--red2);box-shadow:0 0 7px var(--red2)}.fx-row{display:flex;gap:8px}.fx-knob{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}.knob-ring{width:38px;height:38px;border-radius:50%;border:1px solid var(--wire2);position:relative;background:conic-gradient(var(--blue) 0deg,transparent 0deg)}.knob-ring:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel2)}.knob-dot{position:absolute;top:3px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:var(--bright);z-index:1}.knob-lbl{font-size:7px;letter-spacing:2px;color:var(--muted)}.knob-val{font-size:9px;color:var(--bright)}.gref{display:flex;flex-direction:column;gap:3px}.gref-row{display:grid;grid-template-columns:14px 1fr;gap:6px;align-items:center;padding:4px;border:1px solid transparent;font-size:7px}.gref-row.lit{border-color:rgba(255,79,67,.32);background:rgba(255,79,67,.06)}.gref-ico{font-size:11px;opacity:.55}.gref-name{color:var(--bright);letter-spacing:1px}.gref-sound{color:var(--muted);font-size:6px;letter-spacing:1px}
#bottom{border-top:1px solid var(--wire);background:rgba(15,12,16,.96);display:grid;grid-template-rows:30px 1fr 24px}#gstrip{display:flex;overflow-x:auto;border-bottom:1px solid var(--wire);scrollbar-width:none}#gstrip::-webkit-scrollbar{display:none}.gs-item{flex-shrink:0;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:1px solid var(--wire);cursor:pointer}.gs-item.lit{background:rgba(255,79,67,.12)}.gs-ico{font-size:12px;opacity:.45}.gs-lbl{font-size:6px;letter-spacing:1px;color:var(--muted)}.gs-item.lit .gs-lbl{color:var(--red3)}#pad-grid{display:grid;grid-template-columns:repeat(8,1fr)}.pad{border:0;border-right:1px solid var(--wire);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;overflow:hidden;touch-action:manipulation}.pad:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,255,255,.28),transparent 70%);opacity:0;transition:.05s}.pad.hit{background:var(--red)!important}.pad.hit:after{opacity:1}.pad.muted{opacity:.28}.pad.solo{box-shadow:inset 0 0 0 1px var(--amber)}.pad-ico{font-size:14px}.pad-name{font-family:Impact,"Arial Black",sans-serif;font-size:12px;letter-spacing:1px;color:rgba(205,189,204,.48)}.pad.hit .pad-name{color:white}.pad-key{font-size:6px;color:rgba(205,189,204,.22)}#vu-strip{display:flex;border-top:1px solid var(--wire)}.vu-c{flex:1;position:relative;border-right:1px solid var(--wire);overflow:hidden}.vu-h{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(to right,var(--green),var(--amber),var(--red2));transition:width .05s}.vu-l{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:6px;color:rgba(205,189,204,.28);z-index:1}
@media(max-width:760px){#app{grid-template-rows:52px 1fr 172px}header{padding:0 10px}.brand-sub,.bpm-block,.led-chip span{display:none}.brand-name{font-size:21px;letter-spacing:4px}.hdr-center{margin-left:auto}.led-row{gap:5px}#main{grid-template-columns:1fr}#right-panel{display:none}#videoEl.visible{opacity:.52}#gFlash.show{font-size:38px}#pad-grid{grid-template-columns:repeat(4,1fr)}#bottom{grid-template-rows:30px 1fr 24px}.pad-name{font-size:11px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><div class="brand-name">RED808</div><div class="brand-sep"></div><div class="brand-sub">Gesture Pro · Master Live</div></div><div class="hdr-center"><div class="mode-pill ws-off" id="modePill"><div class="dot"></div><span id="modeText">WS OFF</span></div><div class="bpm-block"><div class="bpm-val" id="bpmVal">120</div><div class="bpm-lbl">BPM</div></div></div><div class="hdr-right"><div class="led-row"><div class="led-chip"><div class="led" id="ledWs"></div><span>WS</span></div><div class="led-chip"><div class="led" id="ledL"></div><span>L.HAND</span></div><div class="led-chip"><div class="led" id="ledR"></div><span>R.HAND</span></div><div class="led-chip"><div class="led" id="ledTrig"></div><span>TRIG</span></div></div><button id="camBtn" onclick="toggleCamera()">ACTIVAR CAM</button></div></header>
<div id="main"><div id="cam-view"><div class="cc tl"></div><div class="cc tr"></div><div class="cc bl"></div><div class="cc br"></div><div class="zone-lbl left">MANO IZQ · FX / MUTE</div><div class="zone-lbl right">MANO DER · TRIGGER</div><div class="zone-lbl head">VU MASTER · LIVE</div><div class="fx-bar" id="fxReverb"><div id="fxReverbFill"></div></div><div class="fx-bar" id="fxDelay"><div id="fxDelayFill"></div></div><div class="fx-lbl" id="lblReverb">RVB</div><div class="fx-lbl" id="lblDelay">DLY</div><video id="videoEl" autoplay muted playsinline></video><canvas id="mainCanvas"></canvas><div id="gFlash"></div></div><div id="right-panel"><div class="rpanel-block"><div class="block-title">Canales · Master</div><div class="ch-strips" id="chStrips"></div></div><div class="rpanel-block"><div class="block-title">FX · Mano Izquierda</div><div class="fx-row"><div class="fx-knob"><div class="knob-ring" id="knobReverb"><div class="knob-dot"></div></div><div class="knob-lbl">REVERB</div><div class="knob-val" id="kvReverb">0%</div></div><div class="fx-knob"><div class="knob-ring" id="knobDelay"><div class="knob-dot"></div></div><div class="knob-lbl">DELAY</div><div class="knob-val" id="kvDelay">0%</div></div><div class="fx-knob"><div class="knob-ring" id="knobFilter"><div class="knob-dot"></div></div><div class="knob-lbl">FILTER</div><div class="knob-val" id="kvFilter">50%</div></div></div></div><div class="rpanel-block" style="flex:1;overflow:auto"><div class="block-title">Referencia de gestos</div><div class="gref" id="gref"></div></div></div></div>
<div id="bottom"><div id="gstrip"></div><div id="pad-grid"></div><div id="vu-strip"></div></div>
</div>
<script>
'use strict';
const SOUND_PAD_MAP={kick:0,snare:1,hihat:2,oh:3,ride:4,clap:5,bass:6,tom:8};
const PAD_ORDER=['kick','snare','hihat','clap','tom','bass','ride','oh'];
const PAD_META={kick:['BD','Q','KICK','✊','💥'],snare:['SD','W','SNARE','☝','🥁'],hihat:['HH','E','HI-HAT','🖐','🔔'],clap:['CP','R','CLAP','🤌','👏'],tom:['TM','A','TOM','🤙','🪘'],bass:['BS','S','BASS','🤘','〰'],ride:['RD','D','RIDE','🤟','🔘'],oh:['OH','F','OPEN','✌','🔓']};
const KB={q:'kick',w:'snare',e:'hihat',r:'clap',a:'tom',s:'bass',d:'ride',f:'oh'};
const MOBILE_MODE=matchMedia('(max-width:900px)').matches;
const GCD=MOBILE_MODE?{kick:150,snare:120,hihat:65,clap:120,tom:120,bass:150,oh:90,ride:95,mute:500,unmute:500}:{kick:200,snare:150,hihat:80,clap:145,tom:145,bass:180,oh:100,ride:110,mute:600,unmute:600};
const gLastT={};Object.keys(GCD).forEach(k=>gLastT[k]=0);
const CONFIRM_FRAMES=MOBILE_MODE?2:3;
let ws=null,wsTimer=null,useCamera=false,camStream=null,mpHands=null,frameLoopHandle=0,frameLoopBusy=false;
let liveLmR=null,liveLmL=null,liveGR=null,liveGL=null,rBuf=[],lBuf=[],prevRightWrist=null,lastVelocity=96,lastPad='kick',flashAlpha=0,flashColor='255,79,67',masterEnergy=0,syntheticPhase=0,lastLoopT=0;
const vu={};PAD_ORDER.forEach(k=>vu[k]=0);const channels={};PAD_ORDER.forEach(k=>channels[k]=false);let soloChannel=null;
const trailR=[],trailL=[],TRAIL_LEN=32;
function initDom(){const ch=document.getElementById('chStrips'),gs=document.getElementById('gstrip'),pg=document.getElementById('pad-grid'),vuStrip=document.getElementById('vu-strip'),gref=document.getElementById('gref');PAD_ORDER.forEach(n=>{const m=PAD_META[n];ch.insertAdjacentHTML('beforeend',`<div class="ch-strip" id="ch-${n}" onclick="toggleMute('${n}')"><div class="ch-name">${m[2]}</div><div class="ch-vu"><div class="ch-vu-fill" id="cv-${n}"></div></div><div class="ch-mut" id="cm-${n}">·</div><div class="ch-dot"></div></div>`);gs.insertAdjacentHTML('beforeend',`<div class="gs-item" id="gs-${n}" onclick="triggerSound('${n}',120)"><div class="gs-ico">${m[3]}</div><div class="gs-lbl">${m[2]}</div></div>`);pg.insertAdjacentHTML('beforeend',`<button class="pad" id="pad-${n}" onclick="triggerSound('${n}',120)"><div class="pad-ico">${m[4]}</div><div class="pad-name">${m[0]}</div><div class="pad-key">${m[1]}</div></button>`);vuStrip.insertAdjacentHTML('beforeend',`<div class="vu-c"><div class="vu-h" id="vu-${n}"></div><div class="vu-l">${m[0]}</div></div>`);gref.insertAdjacentHTML('beforeend',`<div class="gref-row" id="gr-${n}"><div class="gref-ico">${m[3]}</div><div><div class="gref-name">${m[2]}</div><div class="gref-sound">Pad ${SOUND_PAD_MAP[n]} · master live</div></div></div>`)});gref.insertAdjacentHTML('beforeend',`<div class="gref-row" id="gr-mute"><div class="gref-ico">L</div><div><div class="gref-name">MUTE ALL</div><div class="gref-sound">Puño izquierdo</div></div></div><div class="gref-row" id="gr-unmute"><div class="gref-ico">L</div><div><div class="gref-name">UNMUTE ALL</div><div class="gref-sound">Palma izquierda</div></div></div><div class="gref-row" id="gr-fx"><div class="gref-ico">L</div><div><div class="gref-name">FX CONTROL</div><div class="gref-sound">X/Y reverb delay filter</div></div></div>`)}
function wsUrl(){return `${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws`}function apiBaseUrl(){return location.origin}function setWsStatus(txt,on=false){document.getElementById('modeText').textContent=txt;document.getElementById('modePill').classList.toggle('ws-off',!on);document.getElementById('ledWs').className='led '+(on?'g':'r')}function scheduleWsReconnect(){if(wsTimer)return;wsTimer=setTimeout(()=>{wsTimer=null;initWs()},1200)}function initWs(){try{if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;ws=new WebSocket(wsUrl());ws.binaryType='arraybuffer';ws.onopen=()=>setWsStatus('MASTER LIVE',true);ws.onclose=()=>{setWsStatus('WS OFF',false);scheduleWsReconnect()};ws.onerror=()=>setWsStatus('WS ERR',false);ws.onmessage=handleWsMessage}catch(e){setWsStatus('WS ERR',false);scheduleWsReconnect()}}
function handleWsMessage(ev){if(ev.data instanceof ArrayBuffer){const d=new Uint8Array(ev.data);if(d[0]===0xAA&&d.length>=18){let sum=0;PAD_ORDER.forEach((n,i)=>{const value=(d[i+1]||0)/255;vu[n]=Math.max(vu[n],value);sum+=value});masterEnergy=Math.min(1,Math.max(masterEnergy,sum/PAD_ORDER.length,(d[17]||0)/255));return}}try{const msg=JSON.parse(ev.data);if(msg.type==='tempoChange'||msg.type==='tempo')setBpm(msg.value||msg.tempo||120);if(msg.type==='trackMuted'&&msg.track!==undefined){const n=PAD_ORDER[msg.track];if(n){channels[n]=!!msg.muted;updateChannelUI()}}}catch{}}
function sendJson(obj){if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify(obj));return true}return false}async function triggerHttp(pad){try{return (await fetch(`${apiBaseUrl()}/api/trigger?pad=${pad}`,{cache:'no-store'})).ok}catch{return false}}
async function triggerSound(name,velocity=127){const pad=SOUND_PAD_MAP[name];if(pad===undefined||!isAudible(name))return;let sent=false;if(ws&&ws.readyState===WebSocket.OPEN){ws.send(new Uint8Array([0x90,pad,velocity]));sent=true}else sent=await triggerHttp(pad);if(!sent)return;lastPad=name;lastVelocity=velocity;vu[name]=Math.max(vu[name],velocity/127);masterEnergy=Math.max(masterEnergy,velocity/127);flashColor=soundColor(name);flashAlpha=.22;flashPad(name);flashGs(name);flashGr(name);flashCh(name);flashTrig();showFlash(name.toUpperCase())}
function isAudible(name){if(soloChannel)return name===soloChannel;return !channels[name]}function toggleMute(name){if(soloChannel===name)soloChannel=null;else if(!channels[name]&&!soloChannel)channels[name]=true;else if(channels[name])channels[name]=false;else soloChannel=name;sendJson({cmd:'mute',track:SOUND_PAD_MAP[name],value:channels[name]});updateChannelUI()}function muteAll(){PAD_ORDER.forEach(n=>{channels[n]=true;sendJson({cmd:'mute',track:SOUND_PAD_MAP[n],value:true})});soloChannel=null;flashGs('mute');flashGr('mute');updateChannelUI()}function unmuteAll(){PAD_ORDER.forEach(n=>{channels[n]=false;sendJson({cmd:'mute',track:SOUND_PAD_MAP[n],value:false})});soloChannel=null;flashGs('unmute');flashGr('unmute');updateChannelUI()}
function setBpm(v){const bpm=Math.max(60,Math.min(200,Math.round(v)));document.getElementById('bpmVal').textContent=bpm}function setFx(rev,delay,filter){rev=Math.max(0,Math.min(1,rev));delay=Math.max(0,Math.min(1,delay));filter=Math.max(0,Math.min(1,filter));document.getElementById('kvReverb').textContent=Math.round(rev*100)+'%';document.getElementById('kvDelay').textContent=Math.round(delay*100)+'%';document.getElementById('kvFilter').textContent=Math.round(filter*100)+'%';document.getElementById('fxReverbFill').style.height=rev*100+'%';document.getElementById('fxDelayFill').style.height=delay*100+'%';document.getElementById('knobReverb').style.background=`conic-gradient(var(--blue) ${rev*270}deg,transparent ${rev*270}deg)`;document.getElementById('knobDelay').style.background=`conic-gradient(var(--purple) ${delay*270}deg,transparent ${delay*270}deg)`;document.getElementById('knobFilter').style.background=`conic-gradient(var(--amber) ${filter*270}deg,transparent ${filter*270}deg)`;sendJson({cmd:'setReverbMix',value:Math.round(rev*127)});sendJson({cmd:'setDelayMix',value:Math.round(delay*127)});sendJson({cmd:'setFilterCutoff',value:Math.round(filter*127)})}
function updateChannelUI(){PAD_ORDER.forEach(n=>{const strip=document.getElementById('ch-'+n),btn=document.getElementById('cm-'+n),pad=document.getElementById('pad-'+n);if(!strip)return;strip.classList.toggle('muted',channels[n]&&soloChannel!==n);strip.classList.toggle('solo',soloChannel===n);if(btn)btn.textContent=soloChannel===n?'S':channels[n]?'M':'·';if(pad){pad.classList.toggle('muted',channels[n]&&soloChannel!==n);pad.classList.toggle('solo',soloChannel===n)}})}
function handSize(lm){return Math.hypot(lm[0].x-lm[9].x,lm[0].y-lm[9].y)||.1}function fingerUp(tip,pip,sz){return pip.y-tip.y>sz*.12}function thumbUp(tt,ti,sz){return ti.y-tt.y>sz*.08}function detectR(lm){const sz=handSize(lm),tt=lm[4],ti=lm[3],it=lm[8],ip=lm[6],mt=lm[12],mp=lm[10],rt=lm[16],rp=lm[14],pt=lm[20],pp=lm[18],tU=thumbUp(tt,ti,sz),iU=fingerUp(it,ip,sz),mU=fingerUp(mt,mp,sz),rU=fingerUp(rt,rp,sz),pU=fingerUp(pt,pp,sz),ext=[iU,mU,rU,pU].filter(Boolean).length,pinch=Math.hypot(tt.x-it.x,tt.y-it.y)<sz*.5;if(pinch&&ext<=1)return'clap';if(tU&&pU&&!iU&&!mU&&!rU)return'tom';if(iU&&pU&&!mU&&!rU)return'bass';if(iU&&mU&&rU&&!pU)return'ride';if(iU&&mU&&!rU&&!pU)return'oh';if(ext>=4)return'hihat';if(iU&&!mU&&!rU&&!pU)return'snare';if(ext===0&&!tU)return'kick';return null}function detectL(lm){const sz=handSize(lm),tt=lm[4],ti=lm[3],it=lm[8],ip=lm[6],mt=lm[12],mp=lm[10],rt=lm[16],rp=lm[14],pt=lm[20],pp=lm[18],tU=thumbUp(tt,ti,sz),iU=fingerUp(it,ip,sz),mU=fingerUp(mt,mp,sz),rU=fingerUp(rt,rp,sz),pU=fingerUp(pt,pp,sz),ext=[iU,mU,rU,pU].filter(Boolean).length;if(ext===0&&!tU)return{action:'mute'};if(ext>=4)return{action:'unmute'};return{action:'fx',x:lm[0].x,y:lm[0].y}}
function confirmGesture(buf,newG,n){buf.push(newG);if(buf.length>n)buf.shift();if(buf.length<n)return null;const last=buf[buf.length-1];return last&&buf.every(g=>g===last)?last:null}function wristEnergy(lm,prev){const wrist=lm?.[0];if(!wrist)return{velocity:96,next:prev};if(!prev)return{velocity:96,next:{x:wrist.x,y:wrist.y}};const dist=Math.hypot(wrist.x-prev.x,wrist.y-prev.y);return{velocity:Math.max(55,Math.min(127,Math.round(62+dist*950))),next:{x:wrist.x,y:wrist.y}}}
function getUserMediaCompat(c){if(navigator.mediaDevices?.getUserMedia)return navigator.mediaDevices.getUserMedia(c);const legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;if(!legacy)return Promise.reject(new Error('getUserMedia_not_supported'));return new Promise((res,rej)=>legacy.call(navigator,c,res,rej))}function waitForVideoReady(video){if(video.readyState>=2)return Promise.resolve();return new Promise(res=>{const done=()=>{video.removeEventListener('loadedmetadata',done);video.removeEventListener('canplay',done);res()};video.addEventListener('loadedmetadata',done,{once:true});video.addEventListener('canplay',done,{once:true})})}function loadScripts(urls){return Promise.all(urls.map(url=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${url}"]`))return res();const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=rej;document.head.appendChild(s)})))}
async function toggleCamera(){const btn=document.getElementById('camBtn');if(useCamera){useCamera=false;liveLmR=liveLmL=null;if(frameLoopHandle)cancelAnimationFrame(frameLoopHandle);frameLoopHandle=0;frameLoopBusy=false;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}mpHands=null;document.getElementById('videoEl').classList.remove('visible');['ledL','ledR'].forEach(id=>document.getElementById(id).className='led');btn.textContent='ACTIVAR CAM';btn.classList.remove('active');return}if(!window.isSecureContext){alert('La camara necesita HTTPS o localhost. Usa el proxy HTTPS.');return}btn.textContent='CARGANDO';btn.disabled=true;try{camStream=await getUserMediaCompat({video:{facingMode:'user',width:1280,height:720}});const video=document.getElementById('videoEl');video.srcObject=camStream;video.classList.add('visible');video.muted=true;video.setAttribute('playsinline','true');await waitForVideoReady(video);await video.play().catch(()=>{});await loadScripts(['https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js']);mpHands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`});mpHands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.42});mpHands.onResults(onHandResults);useCamera=true;startHandFrameLoop(video);btn.textContent='DETENER';btn.classList.add('active')}catch(e){console.warn('Camera error',e);alert('No se pudo activar la camara en este contexto.');btn.textContent='ACTIVAR CAM'}btn.disabled=false}
function startHandFrameLoop(video){const tick=async()=>{if(!useCamera||!mpHands||!video||video.readyState<2){frameLoopHandle=requestAnimationFrame(tick);return}if(!frameLoopBusy){frameLoopBusy=true;try{await mpHands.send({image:video})}catch(e){console.warn('MediaPipe send failed',e)}finally{frameLoopBusy=false}}frameLoopHandle=requestAnimationFrame(tick)};if(frameLoopHandle)cancelAnimationFrame(frameLoopHandle);frameLoopHandle=requestAnimationFrame(tick)}
function onHandResults(res){liveLmR=liveLmL=null;if(!res.multiHandLandmarks?.length){['ledL','ledR'].forEach(id=>document.getElementById(id).className='led');rBuf=[];lBuf=[];return}for(let i=0;i<res.multiHandLandmarks.length;i++){const lm=res.multiHandLandmarks[i],label=res.multiHandedness?.[i]?.label||'Right';if(label==='Right')liveLmL=lm;else liveLmR=lm}if(liveLmR){document.getElementById('ledR').className='led r';const raw=detectR(liveLmR),energy=wristEnergy(liveLmR,prevRightWrist);prevRightWrist=energy.next;const confirmed=confirmGesture(rBuf,raw,CONFIRM_FRAMES);if(confirmed&&Date.now()-gLastT[confirmed]>=(GCD[confirmed]||250)){gLastT[confirmed]=Date.now();triggerSound(confirmed,energy.velocity)}liveGR=raw}else{document.getElementById('ledR').className='led';liveGR=null;prevRightWrist=null;rBuf=[]}if(liveLmL){document.getElementById('ledL').className='led b';const res2=detectL(liveLmL);liveGL=res2.action;const confirmed=confirmGesture(lBuf,res2.action,CONFIRM_FRAMES);if(confirmed==='mute'&&Date.now()-gLastT.mute>=GCD.mute){gLastT.mute=Date.now();muteAll()}else if(confirmed==='unmute'&&Date.now()-gLastT.unmute>=GCD.unmute){gLastT.unmute=Date.now();unmuteAll()}if(res2.action==='fx')setFx(1-res2.y,res2.x,Math.max(0,Math.min(1,(res2.x+1-res2.y)/2)))}else{document.getElementById('ledL').className='led';liveGL=null;lBuf=[]}}
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];function mirror(lm){return lm.map(p=>({...p,x:1-p.x}))}function addTrail(arr,lm){const w=lm?.[0];if(!w)return;arr.push({x:w.x,y:w.y,t:Date.now()});if(arr.length>TRAIL_LEN)arr.shift()}function drawTrail(ctx,trail,W,H,color){if(trail.length<2)return;const now=Date.now();ctx.save();ctx.lineCap='round';for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],age=(now-b.t)/650,alpha=Math.max(0,1-age)*(i/trail.length);ctx.strokeStyle=`rgba(${color},${alpha*.75})`;ctx.lineWidth=Math.max(.5,(i/trail.length)*4);ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()}ctx.restore()}function drawHand(ctx,lm,W,H,color,glow,gesture){ctx.save();if(gesture){ctx.shadowColor=glow;ctx.shadowBlur=24}ctx.strokeStyle=color;ctx.lineWidth=2;for(const[a,b]of CONN){if(!lm[a]||!lm[b])continue;ctx.beginPath();ctx.moveTo(lm[a].x*W,lm[a].y*H);ctx.lineTo(lm[b].x*W,lm[b].y*H);ctx.stroke()}ctx.shadowBlur=0;lm.forEach((p,i)=>{const tip=[4,8,12,16,20].includes(i),r=tip?(gesture?7:5):3.5;ctx.beginPath();ctx.arc(p.x*W,p.y*H,r,0,Math.PI*2);ctx.fillStyle=tip&&gesture?glow:color;if(tip&&gesture){ctx.shadowColor=glow;ctx.shadowBlur=12}ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=1;ctx.stroke()});ctx.restore()}function drawScope(ctx,W,H,dt){syntheticPhase+=dt*(2.2+masterEnergy*8);const cy=H*.5,amp=H*(.08+.22*masterEnergy);ctx.save();ctx.strokeStyle=`rgba(255,79,67,${.28+.48*masterEnergy})`;ctx.lineWidth=1.6;ctx.shadowColor='rgba(255,79,67,.35)';ctx.shadowBlur=9;ctx.beginPath();for(let x=0;x<W;x+=5){const n=Math.sin(x*.018+syntheticPhase)+Math.sin(x*.043+syntheticPhase*1.7)*.35+Math.sin(x*.009-syntheticPhase*.8)*.22;const y=cy+n*amp*(.55+vu[lastPad]);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.restore()}function drawFxLine(ctx,lm,W,H){const w=lm?.[0];if(!w)return;ctx.save();ctx.setLineDash([3,7]);ctx.strokeStyle='rgba(52,152,219,.28)';ctx.beginPath();ctx.moveTo(w.x*W,0);ctx.lineTo(w.x*W,H);ctx.stroke();ctx.strokeStyle='rgba(155,89,182,.28)';ctx.beginPath();ctx.moveTo(0,w.y*H);ctx.lineTo(W,w.y*H);ctx.stroke();ctx.restore()}
function loop(ts){const now=ts*.001,dt=Math.min(lastLoopT?now-lastLoopT:.016,.05);lastLoopT=now;try{const canvas=document.getElementById('mainCanvas'),view=document.getElementById('cam-view'),W=Math.floor(view.clientWidth)||800,H=Math.floor(view.clientHeight)||400;if(canvas.width!==W)canvas.width=W;if(canvas.height!==H)canvas.height=H;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,W,H);if(flashAlpha>.003){ctx.fillStyle=`rgba(${flashColor},${flashAlpha})`;ctx.fillRect(0,0,W,H);flashAlpha*=.78}drawScope(ctx,W,H,dt);if(liveLmL){const ml=mirror(liveLmL);addTrail(trailL,ml);drawTrail(ctx,trailL,W,H,'52,152,219');if(liveGL==='fx')drawFxLine(ctx,ml,W,H);drawHand(ctx,ml,W,H,'rgba(52,152,219,.78)','rgba(80,190,255,1)',liveGL&&liveGL!=='fx')}if(liveLmR){const mr=mirror(liveLmR);addTrail(trailR,mr);drawTrail(ctx,trailR,W,H,'255,79,67');drawHand(ctx,mr,W,H,'rgba(255,79,67,.86)','rgba(255,138,127,1)',liveGR)}updateVU()}catch(e){console.warn('loop',e)}requestAnimationFrame(loop)}
function updateVU(){let sum=0;PAD_ORDER.forEach(n=>{sum+=vu[n];const w=Math.round(vu[n]*100)+'%';const a=document.getElementById('vu-'+n),b=document.getElementById('cv-'+n);if(a)a.style.width=w;if(b)b.style.width=w;vu[n]=Math.max(0,vu[n]-.035)});masterEnergy=Math.max(0,Math.max(masterEnergy*.94,sum/PAD_ORDER.length))}function soundColor(n){return{kick:'255,79,67',snare:'255,110,95',hihat:'243,156,18',clap:'255,79,67',tom:'230,126,34',bass:'155,89,182',oh:'243,156,18',ride:'46,204,113'}[n]||'255,79,67'}
const timers={};function flash(id,cls='lit',ms=180){const e=document.getElementById(id);if(!e)return;e.classList.add(cls);clearTimeout(timers[id]);timers[id]=setTimeout(()=>e.classList.remove(cls),ms)}function flashPad(n){flash('pad-'+n,'hit',120)}function flashGs(n){flash('gs-'+n,'lit',240)}function flashGr(n){flash('gr-'+n,'lit',240)}function flashCh(n){flash('ch-'+n,'lit',150)}function flashTrig(){const e=document.getElementById('ledTrig');e.className='led r';clearTimeout(e._t);e._t=setTimeout(()=>e.className='led',110)}let flashTimer;function showFlash(t){const e=document.getElementById('gFlash');e.textContent=t;e.classList.add('show');clearTimeout(flashTimer);flashTimer=setTimeout(()=>e.classList.remove('show'),340)}
document.addEventListener('keydown',e=>{if(e.repeat)return;const n=KB[e.key?.toLowerCase()];if(n)triggerSound(n,120)});window.addEventListener('error',e=>{console.warn('Gesture Pro error:',e.message);return true});window.addEventListener('load',()=>{initDom();setFx(.18,.12,.55);initWs();requestAnimationFrame(loop)});
